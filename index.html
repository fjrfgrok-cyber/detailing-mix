<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Detailing Mix</title>
<style>
  :root {
    --bg: #101114; --surface: #1a1c21; --surface-2: #23262d; --fg: #f4f6f8;
    --muted: #9aa3b2; --primary: #3ec8d8; --ink: #062226; --product: #ff4d88;
    --water: #3ec8d8; --border: #313640; --danger: #ff5d5d;
    font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { line-height: 1.45; -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  @media (prefers-reduced-motion: no-preference) {
    button { transition: transform 140ms cubic-bezier(.2,.8,.2,1), background-color 180ms ease, color 180ms ease; }
    button:active { transform: scale(.96); }
    .fill { transition: width 280ms cubic-bezier(.2,.8,.2,1); }
  }
  .wrap { max-width: 32rem; margin: 0 auto; padding: 1.25rem 1rem calc(1.5rem + env(safe-area-inset-bottom)); }
  .kicker { margin: 0; font-size: .75rem; letter-spacing: .16em; text-transform: uppercase; color: var(--primary); }
  h1 { margin: .15rem 0 0; font-size: 1.5rem; }
  .sub { margin: .15rem 0 0; color: var(--muted); font-size: .9rem; }
  .head { display: flex; justify-content: space-between; gap: .75rem; align-items: flex-start; }
  .mark { width: 2.75rem; height: 2.75rem; border-radius: 999px; border: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
  .mark i:first-child { background: var(--product); }
  .mark i:last-child { background: var(--water); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; padding: 1rem; margin: 1rem 0; }
  .sticky { position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); margin: 0 -1rem; padding: .75rem 1rem; }
  .result { border-color: color-mix(in srgb, var(--primary) 40%, var(--border)); }
  .row { display: flex; justify-content: space-between; gap: .75rem; align-items: flex-start; }
  .muted { color: var(--muted); }
  .name { font-weight: 600; }
  .nums { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-top: .75rem; }
  .big { font-size: 1.5rem; font-weight: 650; margin: 0; font-variant-numeric: tabular-nums; }
  .product { color: var(--product); }
  .water { color: var(--water); }
  .bar { display: flex; height: .75rem; border-radius: 999px; overflow: hidden; background: var(--surface-2); margin-top: .75rem; }
  .ghost { height: 2.75rem; border-radius: 999px; border: 1px solid var(--border); padding: 0 .8rem; display: inline-flex; align-items: center; gap: .35rem; }
  h2 { margin: 0 0 .75rem; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  .grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: .5rem; margin-top: .75rem; }
  .chip, .step, .field { height: 2.75rem; border-radius: .75rem; border: 1px solid var(--border); background: var(--surface-2); }
  .chip.on, .seg.on { background: var(--primary); color: var(--ink); border-color: var(--primary); font-weight: 650; }
  .seg { height: 3rem; border-radius: .75rem; background: var(--surface-2); color: var(--muted); font-weight: 650; }
  .line { display: flex; gap: .5rem; align-items: center; margin-top: .4rem; }
  .field { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; flex: 1; background: var(--bg); }
  .field input, .plain { width: 100%; height: 2.75rem; border: 0; background: transparent; text-align: center; font-size: 1.05rem; outline: none; }
  .plain { border: 1px solid var(--border); border-radius: .75rem; background: var(--bg); }
  .field b { text-align: right; padding-right: .45rem; font-variant-numeric: tabular-nums; }
  .field span { color: var(--muted); }
  .field input { text-align: left; padding-left: .45rem; font-weight: 650; font-variant-numeric: tabular-nums; }
  .step { width: 3rem; font-size: 1.25rem; }
  .search { display: flex; align-items: center; gap: .5rem; height: 3rem; border: 1px solid var(--border); border-radius: .75rem; background: var(--surface); padding: 0 .8rem; margin: .5rem 0 1rem; }
  .search input { flex: 1; border: 0; background: transparent; outline: none; }
  .brand { position: sticky; top: 4.6rem; background: var(--bg); color: var(--primary); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; padding: .45rem 0; }
  .product-card { border: 1px solid var(--border); background: var(--surface); border-radius: .75rem; margin-bottom: .5rem; }
  .product-card > button { width: 100%; text-align: left; padding: .8rem .85rem; display: flex; justify-content: space-between; gap: .75rem; }
  .dils { padding: 0 .7rem .7rem; display: grid; gap: .4rem; }
  .dil { min-height: 2.75rem; width: 100%; text-align: left; border-radius: .6rem; background: var(--surface-2); padding: .45rem .7rem; display: flex; justify-content: space-between; gap: .6rem; align-items: center; }
  .dil.on { background: var(--primary); color: var(--ink); }
  .ratio { width: 4.4rem; flex: none; display: grid; grid-template-columns: auto auto 1fr; font-weight: 700; font-variant-numeric: tabular-nums; font-size: .9rem; }
  .ratio i { font-style: normal; opacity: .6; padding: 0 .12rem; }
  a { color: var(--primary); }
  .recipe { display: flex; gap: .4rem; align-items: center; background: var(--surface-2); border-radius: .75rem; padding: .35rem .5rem .35rem .8rem; margin-top: .45rem; }
  .recipe button:first-child { flex: 1; text-align: left; min-height: 2.75rem; }
  .danger { color: var(--danger); height: 2.75rem; padding: 0 .7rem; }
  .note { font-size: .85rem; color: var(--muted); margin: .35rem 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <p class="kicker">Maesal</p>
      <h1>Detailing Mix</h1>
      <p class="sub">1 parte de producto + X de agua. Archivo local, sin servidor.</p>
    </div>
    <div class="mark" aria-hidden="true"><i></i><i></i></div>
  </header>

  <div class="sticky">
    <section class="card result" id="result"></section>
  </div>

  <section class="card">
    <h2>Envase</h2>
    <div class="grid3" id="volumes"></div>
    <label class="note" for="total">Volumen total</label>
    <div class="line">
      <button class="step" id="total-minus" type="button" aria-label="Bajar 100 ml">−</button>
      <input class="plain" id="total" inputmode="numeric">
      <button class="step" id="total-plus" type="button" aria-label="Subir 100 ml">+</button>
    </div>
  </section>

  <div class="grid2" id="modes"></div>

  <section class="card" id="ratio-box"></section>

  <label class="search" for="q">
    <span aria-hidden="true">⌕</span>
    <input id="q" placeholder="Busca Primus, APC, champú…" autocomplete="off">
  </label>
  <div id="list"></div>

  <section class="card">
    <h2>Mis recetas</h2>
    <p class="note">Se quedan en este navegador, en este archivo.</p>
    <div id="recipes"></div>
    <input class="plain" id="custom-name" placeholder="Nombre, por ejemplo Perl exteriores" style="margin-top:.8rem">
    <input class="plain" id="custom-note" placeholder="Para qué es (opcional)" style="margin-top:.5rem">
    <button class="chip" id="save" type="button" style="width:100%;margin-top:.5rem;background:var(--primary);color:var(--ink);font-weight:700">Guardar receta</button>
  </section>
</div>

const VOLUMES = [400, 500, 750, 1000, 5000, 20000];
const ORDER = ["Labocosmetica","Ma-Fra","CarPro","Koch Chemie","ADBL","Vonixx","Cleantle","Ultracoat","Auto Glanz","Autoglanz","Ewocar","Meguiar's","Meguiars","Menzerna","Fictech","Good Stuff","Nextzett","Vintex"];
const KEY = "detailing_mix_file_v1";
const round1 = (n) => Math.round(n * 10) / 10;
const formatParts = (n) => !Number.isFinite(n) ? "—" : Math.abs(n - Math.round(n)) < 0.05 ? String(Math.round(n)) : round1(n).toFixed(1);
const formatPercent = (n) => { const r = round1(n); return Number.isInteger(r) ? String(r) : r.toFixed(1); };
const formatMl = (n) => { const r = round1(n); return (Number.isInteger(r) ? String(r) : r.toFixed(1)) + " ml"; };
const percentFromParts = (parts) => !Number.isFinite(parts) || parts < 0 ? 0 : 100 / (1 + parts);
const partsFromPercent = (percent) => !Number.isFinite(percent) || percent <= 0 ? 100000 : percent >= 100 ? 0 : 100 / percent - 1;
const parseDecimal = (raw) => { const t = String(raw).trim().replace(",", "."); if (!t || t === ".") return null; const n = Number(t); return Number.isFinite(n) ? n : null; };
const mixAmounts = (totalMl, parts) => {
  const total = Number.isFinite(totalMl) && totalMl > 0 ? totalMl : 0;
  const product = Math.min(total, Math.max(0, round1(total > 0 && parts >= 0 ? total / (1 + parts) : 0)));
  const water = Math.max(0, round1(total - product));
  const productPct = total > 0 ? (product / total) * 100 : 0;
  return { product, water, productPct, waterPct: Math.max(0, 100 - productPct) };
};
const fold = (s) => s.toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu, "").replace(/[-_]/g, "");
const $ = (id) => document.getElementById(id);
const state = { total: 500, parts: 10, mode: "ratio", productId: null, dilutionId: null, query: "", openId: null, customs: [], copied: false };
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved && typeof saved === "object") Object.assign(state, saved, { copied: false, query: "", openId: saved.productId || null });
} catch {}
function persist() {
  const { total, parts, mode, productId, dilutionId, customs } = state;
  localStorage.setItem(KEY, JSON.stringify({ total, parts, mode, productId, dilutionId, customs }));
}
function product() { return CATALOG.find((p) => p.id === state.productId) || null; }
function dilution() { return product()?.dilutions.find((d) => d.id === state.dilutionId) || null; }
function setParts(parts) {
  state.parts = Math.max(0, parts);
  state.dilutionId = null;
  persist(); render();
}
function applyDilution(p, d) {
  state.productId = p.id; state.dilutionId = d.id; state.parts = d.parts; state.openId = p.id;
  persist(); render();
  $("result").scrollIntoView({ block: "start", behavior: "smooth" });
}
function render() {
  const p = product();
  const d = dilution();
  const amounts = mixAmounts(state.total, state.parts);
  const who = p ? p.brand + " " + p.name : (state.parts === 0 ? "Producto puro" : "Mezcla 1:" + formatParts(state.parts));
  $("result").innerHTML = "";
  const top = el("div", "row");
  const info = el("div");
  info.append(el("div", "name", who));
  if (d) info.append(el("div", "muted", d.label));
  const copy = el("button", "ghost", state.copied ? "Copiado" : "Copiar");
  copy.type = "button";
  copy.onclick = async () => {
    const text = who + "\nEnvase " + formatMl(state.total) + "\nProducto " + formatMl(amounts.product) + "\nAgua " + formatMl(amounts.water);
    try { await navigator.clipboard.writeText(text); state.copied = true; render(); setTimeout(() => { state.copied = false; render(); }, 1400); } catch {}
  };
  top.append(info, copy);
  const nums = el("div", "nums");
  nums.append(metric(formatMl(amounts.product), "Producto", "product"), metric(formatMl(amounts.water), "Agua", "water"));
  const bar = el("div", "bar");
  bar.append(spanFill("product", amounts.productPct), spanFill("water", amounts.waterPct));
  const foot = el("p", "note", formatPercent(percentFromParts(state.parts)) + "% de producto en " + formatMl(state.total));
  if (p) {
    foot.append(" · ");
    const a = document.createElement("a");
    a.href = p.url; a.target = "_blank"; a.rel = "noreferrer"; a.textContent = "Ficha Maesal";
    foot.append(a);
  }
  $("result").append(top, nums, bar, foot);

  $("volumes").replaceChildren(...VOLUMES.map((ml) => {
    const b = el("button", "chip" + (state.total === ml ? " on" : ""), ml >= 1000 ? (ml / 1000) + " L" : ml + " ml");
    b.type = "button"; b.onclick = () => { state.total = ml; $("total").value = String(ml); persist(); render(); };
    return b;
  }));
  $("total").value = String(state.total);

  $("modes").replaceChildren(...[["ratio", "Ratio 1:X"], ["percent", "Porcentaje"]].map(([mode, label]) => {
    const b = el("button", "seg" + (state.mode === mode ? " on" : ""), label);
    b.type = "button"; b.onclick = () => { state.mode = mode; persist(); render(); };
    return b;
  }));

  const box = $("ratio-box");
  box.innerHTML = "";
  if (state.mode === "ratio") {
    box.append(el("label", "muted", "Partes de agua por cada parte de producto"));
    const line = el("div", "line");
    line.append(step("−", () => setParts(state.parts - 1)), ratioField(), step("+", () => setParts(state.parts + 1)));
    box.append(line);
    const quick = el("div", "grid5");
    for (const value of [0, 5, 10, 20, 50]) {
      const b = el("button", "chip", value === 0 ? "Puro" : "1:" + value);
      b.type = "button"; b.onclick = () => setParts(value);
      quick.append(b);
    }
    box.append(quick);
  } else {
    box.append(el("label", "muted", "Porcentaje de producto en el envase"));
    const line = el("div", "line");
    const input = document.createElement("input");
    input.className = "plain"; input.inputMode = "decimal"; input.value = formatPercent(percentFromParts(state.parts));
    input.oninput = () => { const n = parseDecimal(input.value); if (n == null) return; state.parts = Math.min(100000, Math.max(0, partsFromPercent(Math.min(100, n)))); state.dilutionId = null; persist(); renderKeep(input); };
    line.append(step("−", () => setParts(partsFromPercent(Math.max(0, percentFromParts(state.parts) - 1)))), input, step("+", () => setParts(partsFromPercent(Math.min(100, percentFromParts(state.parts) + 1)))));
    box.append(line, el("p", "note", "Equivale a 1:" + formatParts(state.parts) + ". Máximo 100%."));
  }
  renderList();
  renderRecipes();
}
function renderKeep(input) { const pos = input.selectionStart; render(); const next = boxInput(); if (next) { next.focus(); next.setSelectionRange(pos, pos); } }
function boxInput() { return $("ratio-box").querySelector("input"); }
function renderList() {
  const q = fold(state.query.trim());
  const groups = new Map();
  for (const item of CATALOG) {
    const blob = fold(item.brand + " " + item.name + " " + item.dilutions.map((d) => d.label).join(" "));
    if (q && !blob.includes(q)) continue;
    const list = groups.get(item.brand) || [];
    list.push(item); groups.set(item.brand, list);
  }
  const brands = [...groups.keys()].sort((a, b) => {
    const ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
    if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    return a.localeCompare(b, "es");
  });
  const root = $("list");
  root.innerHTML = "";
  if (!brands.length) { root.append(el("p", "note", "Ningún producto coincide.")); return; }
  for (const brand of brands) {
    root.append(el("h3", "brand", brand));
    for (const item of groups.get(brand)) {
      const open = state.openId === item.id || q.length > 1;
      const card = el("article", "product-card");
      const head = el("button");
      head.type = "button";
      head.append(el("span", "", item.name), el("span", "muted", String(item.dilutions.length)));
      head.onclick = () => { state.openId = open && !q ? null : item.id; renderList(); };
      card.append(head);
      if (open) {
        const dils = el("div", "dils");
        for (const dil of item.dilutions) {
          const b = el("button", "dil" + (state.dilutionId === dil.id ? " on" : ""));
          b.type = "button";
          const mark = el("span", "ratio");
          if (dil.parts === 0) { mark.textContent = "Puro"; mark.style.display = "block"; mark.style.textAlign = "right"; }
          else mark.append(document.createTextNode("1"), el("i", "", ":"), document.createTextNode(formatParts(dil.parts)));
          b.append(el("span", "", dil.label), mark);
          b.onclick = () => applyDilution(item, dil);
          dils.append(b);
        }
        card.append(dils);
      }
      root.append(card);
    }
  }
}
function renderRecipes() {
  const root = $("recipes");
  root.innerHTML = "";
  if (!state.customs.length) root.append(el("p", "note", "Todavía no has guardado ninguna."));
  for (const recipe of state.customs) {
    const row = el("div", "recipe");
    const use = el("button");
    use.type = "button";
    use.append(el("span", "name", recipe.name), el("span", "note", (recipe.note || "Personalizada") + " · 1:" + formatParts(recipe.parts)));
    use.onclick = () => { state.parts = recipe.parts; state.productId = null; state.dilutionId = null; persist(); render(); };
    const del = el("button", "danger", "Borrar");
    del.type = "button";
    del.onclick = () => { state.customs = state.customs.filter((item) => item.id !== recipe.id); persist(); render(); };
    row.append(use, del);
    root.append(row);
  }
}
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}
function metric(value, label, cls) {
  const box = el("div");
  box.append(el("p", "big " + cls, value), el("p", "muted", label));
  return box;
}
function spanFill(cls, pct) {
  const node = el("span", "fill " + cls);
  node.style.width = pct + "%";
  node.style.background = cls === "product" ? "var(--product)" : "var(--water)";
  return node;
}
function step(label, onclick) {
  const b = el("button", "step", label);
  b.type = "button"; b.onclick = onclick;
  return b;
}
function ratioField() {
  const field = el("div", "field");
  field.append(el("b", "", "1"), el("span", "", ":"));
  const input = document.createElement("input");
  input.inputMode = "decimal";
  input.value = formatParts(state.parts);
  input.oninput = () => {
    const n = parseDecimal(input.value);
    if (n == null || n < 0) return;
    state.parts = n; state.dilutionId = null; persist();
    const pos = input.selectionStart;
    render();
    const next = $("ratio-box").querySelector(".field input");
    if (next) { next.focus(); next.setSelectionRange(pos, pos); }
  };
  field.append(input);
  return field;
}
$("total").oninput = () => { const n = parseDecimal($("total").value); if (n != null && n >= 0) { state.total = Math.round(n); persist(); render(); } };
$("total-minus").onclick = () => { state.total = Math.max(0, state.total - 100); persist(); render(); };
$("total-plus").onclick = () => { state.total = state.total + 100; persist(); render(); };
$("q").oninput = () => { state.query = $("q").value; renderList(); };
$("save").onclick = () => {
  const name = $("custom-name").value.trim();
  if (!name) return;
  state.customs.unshift({ id: crypto.randomUUID(), name, note: $("custom-note").value.trim(), parts: state.parts });
  $("custom-name").value = ""; $("custom-note").value = "";
  persist(); render();
};
if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(() => {});
